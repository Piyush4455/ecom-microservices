spring.application.name=ecom-application

spring.datasource.url=jdbc:postgresql://localhost:5432/ecomdb?currentSchema=public&options=-c%20TimeZone=Asia/Kolkata
spring.datasource.username=ecomdb
spring.datasource.password=ecomdb
spring.jpa.database=POSTGRESQL
#spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
spring.jackson.time-zone=Asia/Kolkata
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'Asia/Kolkata'
#spring.h2.console.enabled=true
#spring.datasource.url=jdbc:h2:mem:test
#spring.h2.console.path=/h2-console
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

management.endpoints.web.exposure.include=beans,health
management.endpoint.health.show-details=always
management.info.env.enabled=true

info.app.name=ecom-application
info.app.description=E-commerce Application
info.app.version=1.0.0